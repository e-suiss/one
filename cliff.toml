# T-41 (7)

[changelog]
header = """
# Changelog

All notable changes to this project are documented in this file. The format follows
[Keep a Changelog](https://keepachangelog.com/en/1.1.0/), entries are generated from
[Conventional Commits](https://www.conventionalcommits.org/en/v1.0.0/) with
[git-cliff](https://git-cliff.org/), and the server uses [Semantic Versioning](https://semver.org/).
Security fixes are listed in their own section.
"""
body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}\
{% if commit.breaking %}[**breaking**] {% endif %}\
{{ commit.message | upper_first }}\
{% for link in commit.links %} ([{{ link.text }}]({{ link.href }})){% endfor %}\
{% endfor %}
{% endfor %}
"""
footer = ""
trim = false

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
protect_breaking_commits = true
filter_commits = false
tag_pattern = "v[0-9]+\\.[0-9]+\\.[0-9]+.*"
sort_commits = "oldest"
commit_parsers = [
  { message = "^fix\\(security\\)", group = "<!-- 0 -->Security" },
  { body = ".*(security fix|SECURITY:)", group = "<!-- 0 -->Security" },
  { message = "^feat", group = "<!-- 1 -->Added" },
  { message = "^fix", group = "<!-- 2 -->Fixed" },
  { message = "^perf", group = "<!-- 3 -->Performance" },
  { message = "^refactor", group = "<!-- 4 -->Changed" },
  { message = "^revert", group = "<!-- 5 -->Reverted" },
  { message = "^docs", group = "<!-- 6 -->Documentation" },
  { message = "^(build|ci|chore|test|style)", skip = true },
  { message = ".*", group = "<!-- 7 -->Other" },
]
