[package]
name = "xtask"
description = "Repository rule checks, catalog generation and development automation (T-26 (6), T-41, T-55)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
boon = { version = "=0.6.1", default-features = false }
serde = { workspace = true, features = ["std", "derive"] }
serde_json = { workspace = true, features = ["std"] }
toml = { workspace = true, features = ["std", "parse", "serde", "display"] }
yaml-rust2 = { version = "=0.13.0", default-features = false }

[lints]
workspace = true
