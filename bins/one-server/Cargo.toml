[package]
name = "one-server"
description = "The single One server binary; modules run as roles (T-4)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
axum = { workspace = true, features = ["http1", "http2", "tokio"] }
getrandom = { workspace = true, features = ["std"] }
one-access-client = { workspace = true, features = ["fetch"] }
one-config.workspace = true
one-relay-client.workspace = true
one-runtime.workspace = true
one-http.workspace = true
one-telemetry.workspace = true
one-work-client.workspace = true
reqwest = { workspace = true, features = ["rustls"] }
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "signal", "time"] }
tracing = { workspace = true, features = ["std"] }

[lints]
workspace = true
