# OO-4, OO-29, OO-36

[target]
specification = "A2A Protocol Specification"
version = "1.0.1"
released = "2026-05-28"
source = "https://github.com/a2aproject/A2A/releases/tag/v1.0.1"
protocol_version_header = "1.0"
binding = "HTTP+JSON"

[[check]]
id = "A2A-1"
requirement = "Requests carry A2A-Version 1.0; an unsupported version is answered with VersionNotSupportedError"
a2a_section = "14.2.1"
rules = ["OO-4"]

[[check]]
id = "A2A-2"
requirement = "Requests and responses use media type application/a2a+json"
a2a_section = "11.1, 14.1.1"
rules = ["OO-4", "OO-29"]

[[check]]
id = "A2A-3"
requirement = "JSON field names are camelCase and enums use ProtoJSON names (ROLE_USER, TASK_STATE_INPUT_REQUIRED)"
a2a_section = "5.5"
rules = ["OO-4"]
vectors = ["vectors/schema/message.json", "vectors/schema/task.json"]

[[check]]
id = "A2A-4"
requirement = "Agent Card lists the One Federation AgentExtension with required true and the params of schemas/agent-extension.v1.json"
a2a_section = "4.4.4, 4.6.1"
rules = ["OO-4"]
vectors = ["vectors/schema/agent-extension.json"]

[[check]]
id = "A2A-5"
requirement = "Client sends A2A-Extensions with the extension URI; server refuses a request without it with ExtensionSupportRequiredError and lists activated extensions in the response A2A-Extensions"
a2a_section = "3.2.6, 3.3.4, 14.2.2"
rules = ["OO-4"]

[[check]]
id = "A2A-6"
requirement = "A request for another extension version is not served by falling back to v1"
a2a_section = "4.6.3"
rules = ["OO-4"]

[[check]]
id = "A2A-7"
requirement = "Every Message, and the commitment Artifact, lists the extension URI in extensions and keys its extension object by that URI in metadata"
a2a_section = "4.1.4, 4.1.7, 4.6.2"
rules = ["OO-4"]
vectors = ["vectors/schema/message.json", "vectors/schema/task.json"]

[[check]]
id = "A2A-8"
requirement = "Every Part holds exactly one of text or data; raw and url parts are absent"
a2a_section = "4.1.6"
rules = ["OO-4", "OO-17"]
vectors = ["vectors/schema/message.json"]

[[check]]
id = "A2A-9"
requirement = "messageId is unique per message and the receiver deduplicates on it; contextId equals the Work correlation id on every message of the chain"
a2a_section = "4.1.4"
rules = ["OO-4", "OO-16"]
vectors = ["vectors/offer-version.json"]

[[check]]
id = "A2A-10"
requirement = "Task states follow a2a-mapping.toml state rows; input-required and auth-required are the two negotiation waits"
a2a_section = "4.1.3"
rules = ["OO-4"]
vectors = ["vectors/schema/task.json"]

[[check]]
id = "A2A-11"
requirement = "Message send uses POST /message:send; Task read uses GET /tasks/{id}; errors use the google.rpc.Status form with ErrorInfo domain a2a-protocol.org"
a2a_section = "11.3, 11.6"
rules = ["OO-4"]

[[check]]
id = "A2A-12"
requirement = "Person and agent identity and authority come from the envelope and the identity service; an Agent Card signature is checked only as integrity of the card for its domain"
rules = ["OO-3", "OO-4"]

[[check]]
id = "A2A-13"
requirement = "Person-to-person: the HTTP+JSON request is the plaintext of an MLS application message in the agent mailbox; organisation agents: the same request over TLS directly"
rules = ["OO-4", "OO-29"]
