# OO-17

version = 1
rule = "Before display, every character in these ranges is removed from note text; all other characters, markup included, are shown literally"
kept = "U+0009 tab and U+000A line feed"

[[range]]
from = "U+0000"
to = "U+0008"
class = "control"

[[range]]
from = "U+000B"
to = "U+001F"
class = "control"

[[range]]
from = "U+007F"
to = "U+009F"
class = "control"

[[range]]
from = "U+00AD"
to = "U+00AD"
class = "format"

[[range]]
from = "U+034F"
to = "U+034F"
class = "format"

[[range]]
from = "U+061C"
to = "U+061C"
class = "bidi"

[[range]]
from = "U+115F"
to = "U+1160"
class = "filler"

[[range]]
from = "U+17B4"
to = "U+17B5"
class = "filler"

[[range]]
from = "U+180B"
to = "U+180F"
class = "variation_selector"

[[range]]
from = "U+200B"
to = "U+200F"
class = "format"

[[range]]
from = "U+202A"
to = "U+202E"
class = "bidi"

[[range]]
from = "U+2060"
to = "U+206F"
class = "format"

[[range]]
from = "U+3164"
to = "U+3164"
class = "filler"

[[range]]
from = "U+FE00"
to = "U+FE0F"
class = "variation_selector"

[[range]]
from = "U+FEFF"
to = "U+FEFF"
class = "format"

[[range]]
from = "U+FFA0"
to = "U+FFA0"
class = "filler"

[[range]]
from = "U+FFF9"
to = "U+FFFB"
class = "format"

[[range]]
from = "U+1D173"
to = "U+1D17A"
class = "format"

[[range]]
from = "U+E0000"
to = "U+E0FFF"
class = "tag"
