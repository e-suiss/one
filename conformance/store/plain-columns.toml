# OP-4 (2), OP-5, T-32 (4), T-32 (8), PV-6, SEC-30
version = 1
encrypted_type = "bytea"

[[column]]
name = "owner"
sql_type = "text"
kind = "identity"
basis = "PV-6"
meaning = "account identifier (PartyRef id), the scope prefix of every key"
meaning_tr = "hesap kimliği (PartyRef id), her anahtarın kapsam öneki"

[[column]]
name = "id"
sql_type = "uuid"
kind = "identity"
basis = "OP-4 (2)"
meaning = "opaque UUIDv7 row id; its time part equals what recorded_at shows"
meaning_tr = "opak UUIDv7 satır kimliği; zaman kısmı recorded_at'in gösterdiğine eşittir"

[[column]]
name = "retention_class"
sql_type = "text"
kind = "class"
basis = "PV-6"
meaning = "retention class accessed"
meaning_tr = "erişilen saklama sınıfı"
values = ["one_memory", "one_model", "one_observation", "one_sensitive", "one_provider_trace", "one_browser_profile", "one_training_lineage"]

[[column]]
name = "region"
sql_type = "text"
kind = "class"
basis = "PV-6"
meaning = "region"
meaning_tr = "bölge"

[[column]]
name = "recorded_at"
sql_type = "timestamptz"
kind = "time"
basis = "PV-6"
meaning = "write time"
meaning_tr = "yazma zamanı"

[[column]]
name = "deleted_at"
sql_type = "timestamptz"
kind = "time"
basis = "OP-4 (2)"
meaning = "soft delete"
meaning_tr = "yumuşak silme"

[[column]]
name = "version"
sql_type = "integer"
kind = "version"
basis = "OP-4 (2)"
meaning = "record version"
meaning_tr = "kayıt sürümü"

[[column]]
name = "supersedes"
sql_type = "uuid"
kind = "version"
basis = "OP-4 (2)"
meaning = "previous version row"
meaning_tr = "önceki sürüm satırı"

[[column]]
name = "status"
sql_type = "text"
kind = "status"
basis = "OP-4 (2)"
meaning = "general row status only; the memory lifecycle stays encrypted"
meaning_tr = "yalnız genel satır durumu; hafıza yaşam döngüsü şifreli kalır"
values = ["active", "superseded", "deleted"]

[[column]]
name = "record_key_id"
sql_type = "uuid"
kind = "crypto"
basis = "OP-4 (2)"
meaning = "record key id, for shred"
meaning_tr = "imha için kayıt anahtarı kimliği"

[[column]]
name = "wrapped_record_key"
sql_type = "bytea"
kind = "crypto"
basis = "OP-4 (2)"
meaning = "record key wrapped to the class DEK (AES-256 Key Wrap, 40 bytes)"
meaning_tr = "sınıf DEK'ine sarılı kayıt anahtarı (AES-256 Key Wrap, 40 bayt)"

[[column]]
name = "dek_id"
sql_type = "uuid"
kind = "crypto"
basis = "OP-4 (2)"
meaning = "class DEK id"
meaning_tr = "sınıf DEK kimliği"

[[column]]
name = "kek_id"
sql_type = "text"
kind = "crypto"
basis = "OP-4 (2)"
meaning = "KEK id the DEK is wrapped to"
meaning_tr = "DEK'in sarıldığı KEK kimliği"

[[column]]
name = "ciphertext"
sql_type = "bytea"
kind = "crypto"
basis = "PV-6"
meaning = "nonce and AES-256-GCM ciphertext of the encrypted fields"
meaning_tr = "şifreli alanların nonce'u ve AES-256-GCM şifreli metni"

[[column]]
name = "ciphertext_len"
sql_type = "integer"
kind = "crypto"
basis = "PV-6"
meaning = "record size"
meaning_tr = "kayıt boyutu"

[[column]]
name = "promise_version"
sql_type = "integer"
kind = "crypto"
basis = "PV-19"
meaning = "privacy promise version the record was collected under"
meaning_tr = "kaydın toplandığı gizlilik vaadi sürümü"

[[column]]
name = "source_id"
sql_type = "uuid"
kind = "derived"
basis = "OP-5"
meaning = "source row of a derived part"
meaning_tr = "türetilmiş parçanın kaynak satırı"

[[column]]
name = "source_version"
sql_type = "integer"
kind = "derived"
basis = "OP-5"
meaning = "source version of a derived part"
meaning_tr = "türetilmiş parçanın kaynak sürümü"

[[column]]
name = "embedding_model"
sql_type = "text"
kind = "derived"
basis = "OP-5"
meaning = "model that produced a vector part"
meaning_tr = "vektör parçasını üreten model"

[[column]]
name = "embedding_model_version"
sql_type = "text"
kind = "derived"
basis = "OP-5"
meaning = "version of that model"
meaning_tr = "o modelin sürümü"

[[column]]
name = "index_part_no"
sql_type = "integer"
kind = "derived"
basis = "OP-5"
meaning = "encrypted index part number"
meaning_tr = "şifreli indeks parça numarası"

[[column]]
name = "job_id"
sql_type = "uuid"
kind = "queue"
basis = "T-27 (7)"
meaning = "job row id"
meaning_tr = "iş satırı kimliği"

[[column]]
name = "job_kind"
sql_type = "text"
kind = "queue"
basis = "T-27 (7)"
meaning = "job kind"
meaning_tr = "iş türü"
values = ["consolidation", "personal_training", "reembedding", "export", "shred"]

[[column]]
name = "state"
sql_type = "text"
kind = "queue"
basis = "T-27 (7)"
meaning = "job state"
meaning_tr = "iş durumu"

[[column]]
name = "attempts"
sql_type = "integer"
kind = "queue"
basis = "T-27 (7)"
meaning = "attempt count"
meaning_tr = "deneme sayısı"

[[column]]
name = "run_after"
sql_type = "timestamptz"
kind = "queue"
basis = "T-27 (7)"
meaning = "earliest run time"
meaning_tr = "en erken çalışma zamanı"

[[column]]
name = "lease_until"
sql_type = "timestamptz"
kind = "queue"
basis = "T-27 (7)"
meaning = "lease end"
meaning_tr = "kira sonu"

[[column]]
name = "permission_id"
sql_type = "uuid"
kind = "queue"
basis = "PV-65"
meaning = "key permission the job runs under"
meaning_tr = "işin altında çalıştığı anahtar izni"

[[column]]
name = "idempotency_key"
sql_type = "bytea"
kind = "queue"
basis = "T-27 (6)"
meaning = "SHA-256 of the idempotency key"
meaning_tr = "idempotency anahtarının SHA-256'sı"

[[column]]
name = "event_type"
sql_type = "text"
kind = "queue"
basis = "OP-3"
meaning = "outbox CloudEvent type"
meaning_tr = "outbox CloudEvent türü"

[[encrypted_only]]
name = "domain"
basis = "OP-4 (1)"

[[encrypted_only]]
name = "data_class"
basis = "OP-4 (1)"

[[encrypted_only]]
name = "provenance"
basis = "OP-4 (1)"

[[encrypted_only]]
name = "produced_by"
basis = "OP-4 (1)"

[[known_leak]]
name = "one_sensitive retention class"
basis = "PV-6"
meaning = "Seeing rows of the one_sensitive class shows that the user turned on a sensitive area; PV-6 allows the class to be visible."
meaning_tr = "one_sensitive sınıfında satır görmek kullanıcının bir hassas alanı açtığını gösterir; PV-6 sınıfın görünmesine izin verir."

[[rule]]
id = "unlisted-plain-column"
meaning = "A column not listed here is encrypted and must be bytea."
meaning_tr = "Burada listelenmeyen sütun şifrelidir ve bytea olmalıdır."

[[rule]]
id = "listed-type"
meaning = "A listed column has exactly its listed SQL type and, where values are listed, a CHECK over them."
meaning_tr = "Listelenen sütun tam olarak listelenen SQL türündedir ve değerler listelenmişse onlar üzerinde bir CHECK taşır."

[[rule]]
id = "encrypted-only"
meaning = "An encrypted-only name never appears as a plain column; it lives inside the ciphertext."
meaning_tr = "Yalnız şifreli bir ad hiçbir zaman düz sütun olmaz; şifreli metnin içinde yaşar."

[[rule]]
id = "closed"
meaning = "The list is not extended (OP-5); SEC-30 is generated from this file in Turkish and English."
meaning_tr = "Liste genişletilmez (OP-5); SEC-30 bu dosyadan Türkçe ve İngilizce üretilir."
