# AT-42
# AT-5, AT-6, AT-8, AT-12, AT-14
# Relay CH-65, Relay CH-66, Relay CH-68, Relay WF-56, Relay WF-57, Relay PC-46, Relay PC-55

version = 1
forbidden_classes = ["security"]
