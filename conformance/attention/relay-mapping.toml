[[row]]
id = "approval_request"
relay_class = "action_required"
interruption_ceiling = "time-sensitive"
timing_default = "next_break"
timing_immediate_only_if_urgent = true
max_defer_required_on_next_break = true
critical_overlay = true
rules = ["AT-42", "AT-8", "AT-25", "Relay WF-57", "Relay PC-46"]

[[row]]
id = "own_work_info"
relay_class = "transactional"
