# X-13, X-4, X-6, X-10, X-19, X-20, X-36, X-45, X-46, X-61, AT-13

version = 1
schema = "https://suiss.app/schemas/one/interaction/surface-budgets/v1.json"
outcomes = ["full", "minimal", "neutral", "redirect", "none"]
order = ["undeclared_target", "sensitive_on_voice", "approval_above_ceiling", "kind_not_on_target", "always_minimal", "over_budget", "fits"]
text_unit = "unicode_code_point"
byte_unit = "utf8_canonical_json"

[minimal]
sentence_max_chars = 120
label_max_chars = 12
answers = 2
deep_link = true

[rule.undeclared_target]
outcome = "none"
[rule.sensitive_on_voice]
outcome = "neutral"
targets = ["car_voice", "glasses_voice"]
neutral = { tr = "Telefonunda bir şey var.", en = "There is something on your phone." }
[rule.approval_above_ceiling]
outcome = "redirect"
redirect = { tr = "Bunu telefonundan onaylaman gerekiyor.", en = "You need to approve this on your phone." }
[rule.kind_not_on_target]
outcome = "minimal"
[rule.always_minimal]
outcome = "minimal"
[rule.over_budget]
outcome = "minimal"
[rule.fits]
outcome = "full"

[target.workspace]
class = ["phone", "desktop"]
kinds = ["approval", "choice", "question", "info", "progress", "receipt", "comparison", "form", "digest_item"]
max_components = 12
max_choice_options = 10
max_comparison_options = 4
max_form_fields = 20

[target.notification]
class = ["phone", "desktop", "watch"]
kinds = ["approval", "choice", "question", "info", "receipt", "comparison", "form"]
max_title_chars = 64
max_body_chars = 120
max_actions = 2
lock_screen_sensitive = "relay_neutral_text"
always_minimal = true

[target.live_activity]
class = ["phone"]
platform = "ios"
kinds = ["progress"]
max_bytes = 4096
bytes_cover = ["attributes", "content_state"]
max_title_chars = 40
max_status_chars = 120
max_actions = 2
max_active_hours = 8
max_visible_hours = 12
network = false

[target.live_update]
class = ["phone"]
platform = "android"
kinds = ["progress"]
chip_max_width_dp = 96
chip_max_chars = 7
custom_view = false
max_title_chars = 40
max_body_chars = 120
max_actions = 3
rich_approval_card = false

[target.widget]
class = ["phone"]
kinds = ["progress", "info", "digest_item"]
max_title_chars = 40
max_body_chars = 80
max_actions = 1
passive_only = true

[target.menu_bar]
class = ["desktop"]
kinds = ["approval", "choice", "question", "info", "progress", "receipt", "digest_item"]
max_title_chars = 48
max_body_chars = 120
max_actions = 2
always_minimal = true

[target.watch_app]
class = ["watch"]
kinds = ["approval", "choice", "question", "info", "progress", "receipt", "comparison", "form", "digest_item"]
always_minimal = true
max_title_chars = 32
max_body_chars = 120
max_actions = 2
images = 0
lists = 0
approval_gesture = "hold"

[target.complication]
class = ["watch"]
kinds = ["progress", "info", "digest_item"]
always_minimal = true
max_chars = 20
max_actions = 0

[target.car_voice]
class = ["voice:car"]
kinds = ["approval", "question", "info", "progress", "receipt", "choice"]
text = false
visual = false
max_spoken_chars = 200
max_spoken_options = 3
answer = "binary_voice"

[target.glasses_display]
class = ["voice:glasses"]
kinds = ["approval", "choice", "question", "info", "progress", "receipt", "digest_item"]
primitives = ["text", "image", "list", "button"]
video = false
max_title_chars = 40
max_body_chars = 160
max_list_items = 3
max_list_item_chars = 40
max_buttons = 2
max_images = 1
image_load = "on_user_open"

[target.glasses_voice]
class = ["voice:glasses"]
kinds = ["approval", "question", "info", "progress", "receipt", "choice"]
max_spoken_chars = 200
max_spoken_options = 3
answer = "binary_voice"
