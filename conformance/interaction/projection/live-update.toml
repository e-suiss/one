# X-4, X-6, X-7, X-13, C-27

version = 1
platform = "android"
style = "Notification.ProgressStyle"
kinds = ["progress"]
budget_target = "live_update"
custom_view = false
rich_approval_card = false
user_dismissed = "never re-posted for the same task"

[map]
short_critical_text = "details.progress.step_label when it is at most 7 characters; a longer label falls back to the percentage of details.progress.fraction rounded down, as 40%; no chip when neither fits"
content_title = "subject.title[locale]"
content_text = "minimal_projection.sentence[locale]"
progress = "details.progress.fraction"
progress_points = "details.steps"
content_intent = "deep_link"
actions = "minimal_projection.yes, minimal_projection.no; approve only within the surface ceiling"
ongoing = true
