[[rule]]
id = "release-store-vendor-only"
meaning = "A release build's trust store holds only roots whose profiles include `release`; xtask fails the build when the simulator root or any `dev`-only root is present."

[[rule]]
id = "no-cloud-attestation-service-root"
meaning = "A cloud provider's attestation service is never a root; the client verifies the vendor chain itself."

[[rule]]
id = "measurement-in-public-log"
meaning = "A verified measurement is accepted only when the public TEE image log holds an entry for it."
