# T-58, T-41 (6), T-57
name: Image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/e-suiss/one

jobs:
  build:
    name: build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Log in to GHCR with the job token
        env:
          TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: printf '%s' "$TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
      - name: Build natively and push by digest
        run: |
          docker buildx create --use
          docker buildx build --platform "linux/${{ matrix.arch }}" \
            -f deploy/docker/Dockerfile \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --provenance=mode=max --sbom=true \
            --output "type=image,name=${IMAGE},push-by-digest=true,name-canonical=true,push=true" \
            --metadata-file "$RUNNER_TEMP/metadata.json" .
          jq -r '."containerimage.digest"' "$RUNNER_TEMP/metadata.json" > "$RUNNER_TEMP/digest-${{ matrix.arch }}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digest-${{ matrix.arch }}
          retention-days: 1

  manifest:
    name: manifest
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: digest-*
          merge-multiple: true
      - name: Log in to GHCR with the job token
        env:
          TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: printf '%s' "$TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
      - name: Tag main and the commit
        run: |
          docker buildx imagetools create \
            -t "$IMAGE:main" -t "$IMAGE:sha-${GITHUB_SHA}" \
            "$IMAGE@$(cat digest-amd64)" "$IMAGE@$(cat digest-arm64)"
          docker buildx imagetools inspect "$IMAGE:sha-${GITHUB_SHA}"
