# T-41 (2), T-44 (1), T-38 (11)
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"

jobs:
  fast:
    name: fast
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true
      - uses: ./.github/actions/setup
        with:
          cache-key: lint
      - name: Format
        run: just fmt-check
      - name: Clippy
        run: just lint
      - name: Repository rules
        run: just rules

  test:
    name: test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    # T-32 (1, 9)
    services:
      postgres:
        image: postgres@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336 # 18.6-trixie
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-not-a-secret
          POSTGRES_INITDB_ARGS: --auth=scram-sha-256 --data-checksums
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      DATABASE_URL: postgres://postgres:ci-only-not-a-secret@localhost:5432/one_compile
      PGPASSWORD: ci-only-not-a-secret
      ONE_TEST_S3_ENDPOINT: http://127.0.0.1:8333
      ONE_TEST_S3_BUCKET: one-dev
      ONE_TEST_S3_ACCESS_KEY: one-dev-access
      ONE_TEST_S3_SECRET_KEY: local-only-not-a-secret
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true
      - uses: ./.github/actions/setup
        with:
          cache-key: test
          tools: nextest
      - name: Committed query metadata is current
        run: just sqlx-check "$RUNNER_TEMP/sqlx"
      - name: Object store
        run: |
          docker run --detach --name objects --publish 127.0.0.1:8333:8333 \
            --volume "$PWD/deploy/compose/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro" \
            chrislusf/seaweedfs@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d \
            mini -ip=127.0.0.1 -ip.bind=0.0.0.0 -bucket=one-dev -s3.config=/etc/seaweedfs/s3.json \
            -s3.autoCreateBucket=false -s3.iam=false -s3.port.iceberg=0 -s3.port.lance=0 -webdav=false \
            -admin.ui=false -master.telemetry=false
          for _ in $(seq 60); do curl -fsS http://127.0.0.1:8333/healthz >/dev/null 2>&1 && exit 0; sleep 1; done
          docker logs objects; exit 1
      - name: Tests
        run: |
          cargo nextest run --workspace --locked --no-tests=pass --profile ci
          cargo test --workspace --locked --doc
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sqlx
          path: ${{ runner.temp }}/sqlx
          if-no-files-found: ignore

  cross:
    name: cross
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          cache-key: cross
      - name: Core and no_std targets
        run: just cross

  # T-45 (3)
  bench:
    name: bench
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          cache-key: bench
      - name: Install Valgrind and gungraun-runner 0.20.0
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends valgrind
          valgrind --version
          if [[ "$(gungraun-runner --version 2>/dev/null || true)" != *" 0.20.0" ]]; then
            cargo install --locked gungraun-runner --version 0.20.0
          fi
      - name: Build the benchmarks
        run: cargo bench --locked --no-run -p one-provenance -p one-proto -p one-interaction
      - name: Instruction counts of the base commit
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          GUNGRAUN_HOME: ${{ runner.temp }}/gungraun
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
        run: |
          : > "$RUNNER_TEMP/compared"
          if [[ -z "$BASE" || "$BASE" =~ ^0+$ ]] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "::notice::no base commit to compare"
            exit 0
          fi
          git worktree add --detach "$RUNNER_TEMP/base" "$BASE"
          cd "$RUNNER_TEMP/base"
          for spec in provenance:provenance proto:task_state proto:records interaction:projection; do
            crate="${spec%%:*}"
            bench="${spec##*:}"
            if [[ -f "crates/$crate/benches/$bench.rs" ]] && grep -q "^name = \"$bench\"$" "crates/$crate/Cargo.toml"; then
              cargo bench --locked -p "one-$crate" --bench "$bench" -- --save-baseline=base
              echo "$spec" >> "$RUNNER_TEMP/compared"
            fi
          done
      - name: Instruction count gate on provenance and the task state machine
        env:
          GUNGRAUN_HOME: ${{ runner.temp }}/gungraun
        run: |
          cargo bench --locked -p one-provenance --bench provenance -- --baseline=base
          cargo bench --locked -p one-proto --bench task_state -- --baseline=base
      - name: Instruction counts on the other hot paths
        env:
          GUNGRAUN_HOME: ${{ runner.temp }}/gungraun
        run: |
          for spec in proto:records interaction:projection; do
            crate="${spec%%:*}"
            bench="${spec##*:}"
            cargo bench --locked -p "one-$crate" --bench "$bench" -- --baseline=base --save-baseline=head
            if grep -qx "$spec" "$RUNNER_TEMP/compared" &&
              ! cargo bench --locked -p "one-$crate" --bench "$bench" -- \
                --load-baseline=head --baseline=base --callgrind-limits='ir=5.0%'; then
              echo "::warning::$bench: instruction count rose more than 5 % over the base commit"
            fi
          done

  core-bindings:
    name: core-bindings
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true
      - uses: ./.github/actions/setup
        with:
          cache-key: core-bindings
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - name: Generated UniFFI bindings equal the committed files
        run: |
          just bindings
          git add --intent-to-add core/bindings/uniffi/generated
          git diff --exit-code -- core/bindings/uniffi/generated
      - name: WASM differential
        run: |
          (cd packages/core && npm ci)
          just differential-wasm
      - name: Install Kotlin 2.4.21 and JNA 5.19.1
        env:
          KOTLIN_SHA256: 7cc140e76daf416a0424a5557f99afd7ca89ebd463ea1101261e3e01c33e75cd
          JNA_SHA256: 4fb141dd8ef6b0585ffceea4bc49602fbc6312fa977e2c488794ea3e6aafecae
        run: |
          curl -fsSL -o "$RUNNER_TEMP/kotlin.zip" \
            https://github.com/JetBrains/kotlin/releases/download/v2.4.21/kotlin-compiler-2.4.21.zip
          echo "$KOTLIN_SHA256  $RUNNER_TEMP/kotlin.zip" | sha256sum --check --strict
          unzip -q "$RUNNER_TEMP/kotlin.zip" -d "$RUNNER_TEMP"
          curl -fsSL -o "$RUNNER_TEMP/jna.jar" \
            https://repo1.maven.org/maven2/net/java/dev/jna/jna/5.19.1/jna-5.19.1.jar
          echo "$JNA_SHA256  $RUNNER_TEMP/jna.jar" | sha256sum --check --strict
          echo "$RUNNER_TEMP/kotlinc/bin" >> "$GITHUB_PATH"
      - name: Kotlin differential
        run: just differential-kotlin "$RUNNER_TEMP/jna.jar" "$RUNNER_TEMP/kotlinc/lib/kotlin-stdlib.jar"

  core-swift:
    name: core-swift
    runs-on: macos-15
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true
      - uses: ./.github/actions/setup
        with:
          cache-key: core-swift
      - name: Swift differential
        run: just differential-swift

  supply-chain:
    name: supply-chain
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          cache-key: tools
          tools: deny vet
      - name: cargo-deny
        run: just deny
      - name: cargo-vet
        run: just vet

  secrets:
    name: secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install gitleaks 8.30.1
        env:
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -fsSL -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "$GITLEAKS_SHA256  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      - name: Scan history
        run: '"$RUNNER_TEMP/gitleaks" git --redact --no-banner --exit-code 1 --config .gitleaks.toml .'

  commits:
    name: commits
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          cache-key: lint
      - name: Conventional Commits and security-sensitive trailers
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ -z "$BASE" || "$BASE" =~ ^0+$ ]] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            BASE="$(git rev-list --max-parents=0 HEAD | tail -1)"
          fi
          cargo xtask commits "$BASE" HEAD

  api:
    name: api
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          cache-key: test
      - name: OpenAPI generated from code equals the committed document
        run: cargo test --locked -p one-http --test openapi
      - name: Install oasdiff 1.33.0
        env:
          OASDIFF_SHA256: 43a4e328e2d13ba1552d760aa68d2485c75c5621f309f6ff64ae895188345247
        run: |
          curl -fsSL -o "$RUNNER_TEMP/oasdiff.tar.gz" \
            https://github.com/oasdiff/oasdiff/releases/download/v1.33.0/oasdiff_1.33.0_linux_amd64.tar.gz
          echo "$OASDIFF_SHA256  $RUNNER_TEMP/oasdiff.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/oasdiff.tar.gz" -C "$RUNNER_TEMP" oasdiff
      - name: Install buf 1.73.0
        env:
          BUF_SHA256: 8f2986298ad08f0cc1bf999b9797b7c383adf32d7edf0f73d6f1e1a701baeac1
        run: |
          curl -fsSL -o "$RUNNER_TEMP/buf" https://github.com/bufbuild/buf/releases/download/v1.73.0/buf-Linux-x86_64
          echo "$BUF_SHA256  $RUNNER_TEMP/buf" | sha256sum --check --strict
          chmod +x "$RUNNER_TEMP/buf"
      - name: Protobuf lint and breaking-change gate
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          "$RUNNER_TEMP/buf" lint conformance/rpc
          if [[ -z "$BASE" || "$BASE" =~ ^0+$ ]] || ! git cat-file -e "$BASE:conformance/rpc/buf.yaml" 2>/dev/null; then
            echo "::notice::no earlier Protobuf contract to compare"
          else
            "$RUNNER_TEMP/buf" breaking conformance/rpc --against ".git#ref=$BASE,subdir=conformance/rpc"
          fi
      - name: No breaking change without a new major version
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ -z "$BASE" || "$BASE" =~ ^0+$ ]] || ! git cat-file -e "$BASE:conformance/openapi/one.v1.json" 2>/dev/null; then
            echo "::notice::no earlier OpenAPI document to compare"
            exit 0
          fi
          git show "$BASE:conformance/openapi/one.v1.json" > "$RUNNER_TEMP/base.json"
          "$RUNNER_TEMP/oasdiff" breaking "$RUNNER_TEMP/base.json" conformance/openapi/one.v1.json --fail-on ERR
      - name: AsyncAPI catalog and CloudEvent vectors
        run: cargo xtask check events-catalog
      - name: No breaking event catalog change without a new major version
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ -z "$BASE" || "$BASE" =~ ^0+$ ]] || ! git cat-file -e "$BASE:conformance/events/asyncapi.yaml" 2>/dev/null; then
            echo "::notice::no earlier AsyncAPI catalog to compare"
            exit 0
          fi
          cargo xtask asyncapi-breaking "$BASE"
      - name: One-open submodule at its pinned commit and no copies of its files
        run: cargo xtask check open-submodule

  ml:
    name: ml
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          cache-key: lint
          tools: uv
      - name: Lint, types and guard
        working-directory: ml
        run: |
          uv sync --locked
          uv run --locked ruff format --check .
          uv run --locked ruff check .
          uv run --locked mypy
          uv run --locked python -m one_ml.guard
      - name: Tests
        working-directory: ml
        run: uv run --locked pytest -q

  web:
    name: web
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          cache-key: lint
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - name: Install from lockfiles, no install scripts
        run: just web-install
      - name: Lint, types, format, catalogs, tests
        run: just web-check
