test = false
doc = false
bench = false

[[bin]]
name = "parse_mcp"
path = "fuzz_targets/parse_mcp.rs"
test = false
doc = false
bench = false

[[bin]]
name = "parse_a2a"
path = "fuzz_targets/parse_a2a.rs"
test = false
doc = false
bench = false

[[bin]]
