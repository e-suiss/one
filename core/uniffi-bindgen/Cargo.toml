[package]
name = "one-uniffi-bindgen"
description = "The workspace-local uniffi-bindgen that generates the Swift and Kotlin bindings of one-core (T-42 (6))."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "uniffi-bindgen"
path = "src/main.rs"

[dependencies]
uniffi = { workspace = true, features = ["cli"] }

[lints]
workspace = true
