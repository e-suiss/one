# T-28 (3, 4)
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true
allow-indexing-slicing-in-tests = true

# T-27 (2)
disallowed-methods = [
    { path = "std::time::SystemTime::now", reason = "T-27: read time through the Clock port" },
    { path = "std::time::Instant::now", reason = "T-27: read time through the Clock port" },
    { path = "tokio::time::Instant::now", reason = "T-27: read time through the Clock port" },
    { path = "uuid::Uuid::new_v4", reason = "T-27: randomness comes from the Rng port" },
    { path = "uuid::Uuid::now_v7", reason = "T-27: time and randomness come from the ports" },
    { path = "getrandom::fill", reason = "T-27: randomness comes from the Rng port" },
    { path = "getrandom::getrandom", reason = "T-27: randomness comes from the Rng port" },
]
