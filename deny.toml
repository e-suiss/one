# T-39 (1), T-26 (3), Access F-1

[graph]
all-features = false
no-default-features = false

[output]
feature-depth = 1

[advisories]
unmaintained = "all"
unsound = "all"
yanked = "deny"
ignore = [
    { id = "RUSTSEC-2026-0374", reason = "basic-toml is unmaintained with no successor release; build-time only through uniffi_bindgen and askama, watched in conformance/catalog/watchlist.toml" },
]

[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MIT-0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
]
confidence-threshold = 0.93
unused-allowed-license = "allow"

[licenses.private]
ignore = true
registries = []

# T-5, Access F-1
[[licenses.exceptions]]
allow = ["CDLA-Permissive-2.0"]
crate = "webpki-root-certs"

# T-32, Access F-1
[[licenses.exceptions]]
allow = ["CDLA-Permissive-2.0"]
crate = "webpki-roots"

# T-16 (1)
[[licenses.exceptions]]
allow = ["MPL-2.0"]
crate = "uniffi"

[[licenses.exceptions]]
allow = ["MPL-2.0"]
crate = "uniffi_bindgen"

[[licenses.exceptions]]
allow = ["MPL-2.0"]
crate = "uniffi_core"

[[licenses.exceptions]]
allow = ["MPL-2.0"]
crate = "uniffi_internal_macros"

[[licenses.exceptions]]
allow = ["MPL-2.0"]
crate = "uniffi_macros"

[[licenses.exceptions]]
allow = ["MPL-2.0"]
crate = "uniffi_meta"

[[licenses.exceptions]]
allow = ["MPL-2.0"]
crate = "uniffi_pipeline"

[[licenses.exceptions]]
allow = ["MPL-2.0"]
crate = "uniffi_udl"

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"
deny = [
        { crate = "openssl", reason = "F-1: aws-lc-rs only" },
    { crate = "openssl-sys", reason = "F-1: aws-lc-rs only" },
        { crate = "rsa", reason = "CR-14: Marvin timing side channel, no fix" },
    { crate = "ring", reason = "CR-14: aws-lc-rs only" },
        { crate = "libcrux", reason = "CR-14" },
    { crate = "libcrux-ml-kem", reason = "CR-14" },
    { crate = "libcrux-ml-dsa", reason = "CR-14" },
    { crate = "libcrux-aesgcm", reason = "CR-14" },
    { crate = "libcrux-sha3", reason = "CR-14" },
    { crate = "libcrux-ecdh", reason = "CR-14" },
    { crate = "libcrux-ed25519", reason = "CR-14" },
    { crate = "libcrux-hkdf", reason = "CR-14" },
    { crate = "libcrux-hmac", reason = "CR-14" },
    { crate = "libcrux-kem", reason = "CR-14" },
    { crate = "libcrux-signature", reason = "CR-14" },
        { crate = "ml-kem", reason = "CR-14: unaudited" },
    { crate = "ml-dsa", reason = "CR-14: RUSTSEC-2025-0144" },
    { crate = "slh-dsa", reason = "CR-14: unaudited" },
    { crate = "pqcrypto", reason = "CR-14: PQ comes from aws-lc-rs" },
    { crate = "pqcrypto-mlkem", reason = "CR-14: PQ comes from aws-lc-rs" },
    { crate = "pqcrypto-mldsa", reason = "CR-14: PQ comes from aws-lc-rs" },
    { crate = "pqcrypto-kyber", reason = "CR-14: PQ comes from aws-lc-rs" },
    { crate = "pqcrypto-dilithium", reason = "CR-14: PQ comes from aws-lc-rs" },
    { crate = "pqcrypto-sphincsplus", reason = "CR-14: PQ comes from aws-lc-rs" },
    { crate = "pqcrypto-traits", reason = "CR-14: PQ comes from aws-lc-rs" },
        { crate = "openidconnect", reason = "OP-5: client library, depends on rsa" },
    { crate = "josekit", reason = "OP-5: depends on C OpenSSL" },
    { crate = "ntex", reason = "OP-5: ecosystem and maintenance" },
    { crate = "poem", reason = "OP-5: ecosystem and maintenance" },
    { crate = "h3", reason = "OP-5: ecosystem and maintenance" },
    { crate = "gamlastan", reason = "OP-5: not a SAML domain model (XSW defence)" },
    { crate = "serde_stacker", reason = "OP-5, §14.6: unbounded JSON depth" },
    { crate = "unshare", reason = "OP-5: unmaintained" },
    { crate = "cap", reason = "OP-5: aborts when the limit is exceeded" },
        { crate = "p256", wrappers = ["esuiss-crypto"], reason = "OP-5: aws-lc-rs is 7.6x/4.9x faster; Access OP-140 m.2: verify-only in the shared verify feature" },
    { crate = "diesel@<2.3.8", reason = "OP-5: RUSTSEC-2026-0136" },
        { crate = "io-uring", reason = "SA-22" },
    { crate = "tokio-uring", reason = "SA-22" },
    { crate = "rio", reason = "SA-22" },
    { crate = "glommio", reason = "SA-22" },
    { crate = "monoio", reason = "SA-22" },
        { crate = "fancy-regex", reason = "SA-32: backtracking" },
    { crate = "pcre2", reason = "SA-32: backtracking" },
    { crate = "pcre2-sys", reason = "SA-32: backtracking" },
    { crate = "onig", reason = "SA-32: backtracking" },
    { crate = "onig_sys", reason = "SA-32: backtracking" },
        { crate = "redis", reason = "T-7: no cache without a measurement" },
    { crate = "fred", reason = "T-7: no cache without a measurement" },
    { crate = "memcache", reason = "T-7: no cache without a measurement" },
    { crate = "moka", reason = "T-7: no cache without a measurement" },
    { crate = "mini-moka", reason = "T-7: no cache without a measurement" },
    { crate = "quick_cache", reason = "T-7: no cache without a measurement" },
    { crate = "cached", reason = "T-7: no cache without a measurement" },
        { crate = "aws-sdk-kms", reason = "T-51: keys only through PKCS#11, no cloud KMS" },
    { crate = "rusoto_kms", reason = "T-51: keys only through PKCS#11, no cloud KMS" },
    { crate = "google-cloud-kms", reason = "T-51: keys only through PKCS#11, no cloud KMS" },
    { crate = "google-cloudkms1", reason = "T-51: keys only through PKCS#11, no cloud KMS" },
    { crate = "azure_security_keyvault", reason = "T-51: keys only through PKCS#11, no cloud KMS" },
    { crate = "azure_security_keyvault_keys", reason = "T-51: keys only through PKCS#11, no cloud KMS" },
    { crate = "vaultrs", reason = "T-51: keys only through PKCS#11, no cloud KMS" },
]

[[bans.features]]
crate = "jsonwebtoken"
deny = ["rust_crypto"]

[[bans.features]]
crate = "serde_json"
deny = ["unbounded_depth"]

[[bans.features]]
crate = "rustls"
deny = ["ring"]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
